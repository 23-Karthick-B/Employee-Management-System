<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>EMS Login</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 flex items-center justify-center px-4">

  <div class="w-full max-w-md">


    <div class="text-center mb-8">

      <h1 class="text-4xl font-black tracking-tight text-gray-800">

        Employee
        <span class="text-blue-600">
          Management
        </span>

      </h1>

      <div class="flex items-center justify-center gap-3 mt-3">

        <div class="w-14 h-1 bg-blue-600 rounded-full"></div>

        <p
          id="loginTypeText"
          class="text-xs uppercase tracking-[0.3em] text-gray-500 font-semibold"
        >

          Admin Login

        </p>

      </div>

    </div>


    <div class="bg-white/90 backdrop-blur rounded-3xl shadow-2xl border border-white/50 p-8">


      <div class="flex bg-gray-100 rounded-2xl p-1 mb-8">

        <button
          id="adminBtn"
          onclick="switchRole('ADMIN')"
          class="w-1/2 py-3 rounded-2xl font-bold bg-blue-600 text-white transition-all"
        >

          Admin

        </button>

        <button
          id="employeeBtn"
          onclick="switchRole('EMPLOYEE')"
          class="w-1/2 py-3 rounded-2xl font-bold text-gray-600 transition-all"
        >

          Employee

        </button>

      </div>


      <div class="mb-8 text-center">

        <h2 class="text-2xl font-bold text-gray-800">

          Welcome Back

        </h2>

        <p class="text-sm text-gray-500 mt-2">

          Login to continue

        </p>

      </div>

      <div
        id="error"
        class="hidden mb-4 bg-red-100 border border-red-300 text-red-700 text-sm px-4 py-3 rounded-xl"
      >
      </div>

      <div class="mb-5">

        <label
          id="userLabel"
          class="block text-sm font-semibold text-gray-600 mb-2"
        >

          Username

        </label>

        <input
          id="username"
          type="text"
          placeholder="Enter username"
          class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
        />

      </div>

      <div class="mb-6">

        <label class="block text-sm font-semibold text-gray-600 mb-2">

          Password

        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          class="w-full border border-gray-300 bg-gray-50 rounded-xl px-4 py-3 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
        />

      </div>

      <button
        onclick="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg hover:shadow-xl transition-all duration-200"
      >

        Login

      </button>

      <p
        id="footerText"
        class="text-center text-xs text-gray-400 mt-6"
      >

        Employee Management System • Secure Admin Access

      </p>

    </div>

  </div>

  <script src="./js/auth.js"></script>

</body>

</html>
