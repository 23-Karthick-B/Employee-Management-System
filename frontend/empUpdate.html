<!DOCTYPE html>
<html>

<head>

  <title>
    Update Profile
  </title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

    <!-- HEADER -->

    <div class="px-8 py-6 border-b bg-gradient-to-r from-gray-50 to-blue-50">

      <div class="flex items-center justify-between">

        <div>

          <h2 class="text-2xl font-black tracking-tight text-gray-800">

            Update
            <span class="text-blue-600">
              Profile
            </span>

          </h2>

          <p class="text-sm text-gray-500 mt-1">

            Modify your employee details

          </p>

        </div>

      </div>

    </div>

    <!-- FORM -->

    <div class="p-8 space-y-5">

      <!-- NAME -->

      <div>

        <label class="flex items-center gap-3 mb-2 text-sm font-semibold text-gray-700">

          <input
            type="checkbox"
            id="editName"
            class="w-4 h-4 accent-blue-600"
          >

          Full Name

        </label>

        <input
          id="name"
          disabled
          placeholder="Employee name"
          class="border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 focus:bg-white p-3 w-full rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        >

      </div>

      <!-- EMAIL -->

      <div>

        <label class="mb-2 block text-sm font-semibold text-gray-700">

          Email Address

        </label>

        <input
          id="email"
          disabled
          placeholder="Employee email"
          class="border border-gray-300 bg-gray-100 text-gray-500 p-3 w-full rounded-xl"
        >

      </div>

      <!-- DEPARTMENT -->

      <div>

        <label class="mb-2 block text-sm font-semibold text-gray-700">

          Department

        </label>

        <input
          id="department"
          disabled
          placeholder="Department"
          class="border border-gray-300 bg-gray-100 text-gray-500 p-3 w-full rounded-xl"
        >

      </div>

      <!-- PHONE -->

      <div>

        <label class="flex items-center gap-3 mb-2 text-sm font-semibold text-gray-700">

          <input
            type="checkbox"
            id="editPhone"
            class="w-4 h-4 accent-blue-600"
          >

          Phone Number

        </label>

        <input
          id="phone"
          disabled
          placeholder="Phone number"
          class="border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 focus:bg-white p-3 w-full rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        >

      </div>

      <!-- DOB -->

      <div>

        <label class="mb-2 block text-sm font-semibold text-gray-700">

          Date of Birth

        </label>

        <input
          id="dod"
          type="date"
          disabled
          class="border border-gray-300 bg-gray-100 text-gray-500 p-3 w-full rounded-xl"
        >

      </div>

      <!-- PASSWORD -->

      <div>

        <label class="flex items-center gap-3 mb-2 text-sm font-semibold text-gray-700">

          <input
            type="checkbox"
            id="editPassword"
            class="w-4 h-4 accent-blue-600"
          >

          Change Password

        </label>

        <input
          id="password"
          type="password"
          disabled
          placeholder="New password"
          class="border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 focus:bg-white p-3 w-full rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        >

      </div>

      <!-- CONFIRM PASSWORD -->

      <div>

        <label class="mb-2 block text-sm font-semibold text-gray-700">

          Confirm Password

        </label>

        <input
          id="confirmPassword"
          type="password"
          disabled
          placeholder="Confirm new password"
          class="border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 focus:bg-white p-3 w-full rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        >

      </div>

      <!-- ERROR -->

      <p
        id="error"
        class="text-red-500 text-sm"
      ></p>

      <!-- BUTTONS -->

      <div class="flex gap-3 pt-2">

        <button
          onclick="window.location.href='employee-dashboard.html'"
          class="w-1/2 border border-gray-300 bg-white hover:bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold transition-all duration-200"
        >

          Cancel

        </button>

        <button
          onclick="updateProfile()"
          class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold shadow-sm hover:shadow-md transition-all duration-200"
        >

          Update Profile

        </button>

      </div>

    </div>

  </div>

  <!-- SUCCESS POPUP -->

  <div
    id="successPopup"
    class="fixed top-6 right-6 bg-white border border-green-200 shadow-lg rounded-2xl px-5 py-4 flex items-start gap-4 hidden"
  >

    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center">

      <span class="text-green-600 text-lg font-bold">
        ✓
      </span>

    </div>

    <div>

      <h3 class="font-bold text-gray-800">

        Profile Updated

      </h3>

      <p class="text-sm text-gray-500 mt-1">

        Profile updated successfully.

      </p>

    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/empupdate.js"></script>

  <script>

    function showSuccessPopup() {

      const popup =
        document.getElementById(
          "successPopup"
        );

      popup.classList.remove(
        "hidden"
      );

      setTimeout(() => {

        popup.classList.add(
          "hidden"
        );

      }, 2500);
    }

  </script>

</body>

</html>
