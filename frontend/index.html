<!DOCTYPE html>
<html>
<head>
  <title>EMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-5xl mx-auto">

  <div class="flex justify-between mb-4">
    <h1 class="text-2xl font-bold">Employees</h1>
    <a href="create.html" class="bg-blue-600 text-white px-4 py-2 rounded">
      + Add
    </a>
  </div>

  <div class="flex gap-2 mb-4">
    <input id="name" placeholder="Search Name" class="border p-2 rounded w-1/3">
    <input id="dept" placeholder="Search Dept" class="border p-2 rounded w-1/3">
    <button onclick="search()" class="bg-gray-700 text-white px-4 rounded">
      Search
    </button>
  </div>

  <table class="w-full bg-white rounded shadow">
    <thead class="bg-gray-200">
  <tr>

    <th class="p-3">
      <button onclick="sort('name')" class="flex items-center gap-1 font-semibold">
        Name
        <span id="nameIcon">↕</span>
      </button>
    </th>

    <th class="p-3">
      <button onclick="sort('email')" class="flex items-center gap-1 font-semibold">
        Email
        <span id="emailIcon">↕</span>
      </button>
    </th>

    <th class="p-3">
      <button onclick="sort('department')" class="flex items-center gap-1 font-semibold">
        Department
        <span id="departmentIcon">↕</span>
      </button>
    </th>

    <th class="p-3">Phone</th>

    <th class="p-3">
      <button onclick="sort('dod')" class="flex items-center gap-1 font-semibold">
        DOB
        <span id="dodIcon">↕</span>
      </button>
    </th>

    <th class="p-3">Actions</th>

  </tr>
  </thead>
    <tbody id="table"></tbody>
  </table>

  <div class="flex justify-between mt-4">
    <button id="prevBtn" onclick="prev()"
      class="bg-gray-300 px-3 py-1 rounded">
      Prev
    </button>

    <button id="nextBtn" onclick="next()"
      class="bg-gray-300 px-3 py-1 rounded">
      Next
    </button>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
