<!DOCTYPE html>
<html>
<head>
  <title>EMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-5xl mx-auto">

  <div class="flex justify-between mb-4">
    <h1 class="text-2xl font-bold">Employees</h1>
    <a href="create.html" class="bg-blue-600 text-white px-4 py-2 rounded">
      + Add
    </a>
  </div>

  <div class="flex gap-2 mb-4">
    <input id="name" placeholder="Search Name" class="border p-2 rounded w-1/3">
    <input id="dept" placeholder="Search Dept" class="border p-2 rounded w-1/3">
    <button onclick="search()" class="bg-gray-700 text-white px-4 rounded">
      Search
    </button>
    <button onclick="clearSearch()"
      class="bg-gray-500 text-white px-4 py-2 rounded">
      Clear
    </button>
  </div>
  

  <table class="w-full bg-white rounded shadow">
    <thead class="bg-gray-200">
  <tr>

<th>
  <div class="flex items-center gap-1">

    Name

    <div class="flex flex-col leading-none text-[10px]">

      <span
        id="nameAsc"
        onclick="sort('name','asc')"
        class="cursor-pointer text-gray-400">
        ▲
      </span>

      <span
        id="nameDesc"
        onclick="sort('name','desc')"
        class="cursor-pointer text-gray-400">
        ▼
      </span>

    </div>

  </div>
</th>

  <th class="cursor-pointer" onclick="sort('email')">
      <div class="flex items-center gap-1">
        Email
        <div class="flex flex-col leading-none text-[10px]">
          <span id="emailAsc">▲</span>
          <span id="emailDesc">▼</span>
        </div>
      </div>
  </th>

  <th class="cursor-pointer" onclick="sort('department')">
    <div class="flex items-center gap-1">
      Department
      <div class="flex flex-col leading-none text-[10px]">
        <span id="departmentAsc">▲</span>
        <span id="departmentDesc">▼</span>
      </div>
    </div>
  </th>

    <th class="p-3">Phone</th>

  <th class="cursor-pointer" onclick="sort('dod')">
    <div class="flex items-center gap-1">
      DOB
      <div class="flex flex-col leading-none text-[10px]">
        <span id="dodAsc">▲</span>
        <span id="dodDesc">▼</span>
      </div>
    </div>
  </th>

    <th class="p-3">Actions</th>

  </tr>
  </thead>
    <tbody id="table"></tbody>
  </table>

 <div class="flex justify-between items-center mt-4">

  <div class="flex gap-2">
    <button id="prevBtn"
      onclick="prev()"
      class="bg-gray-300 px-3 py-1 rounded">
      Prev
    </button>

    <button id="nextBtn"
      onclick="next()"
      class="bg-gray-300 px-3 py-1 rounded">
      Next
    </button>
  </div>

  <select id="pageSize"
    onchange="changePageSize()"
    class="border p-2 rounded">

    <option value="5">5 / page</option>
    <option value="10">10 / page</option>
    <option value="15">15 / page</option>
    <option value="20">20 / page</option>

  </select>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/index.js"></script>

</body>
</html>
